[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = ".toolchain/solc"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/"]
fs_permissions = [{ access = "read-write", path = "../deployments/" }]

[rpc_endpoints]
qorechain_testnet = "https://evm-testnet.qore.host"
